version: '3.8'

services:
  # Servicio de la aplicación/API
  pva_app:
    build: .
    container_name: pva_app
    volumes:
      - ./audit:/app/audit
      - ./config:/app/config
    env_file:
      - .env
    ports:
      - "5000:5000"
    command: python scripts/generate_manifesto.py --hash "TU_GENESIS" --folio "5204160405358537"
    restart: always

  # Servicio de base de datos si lo necesitas (opcional)
  # db:
  #   image: postgres:13
  #   environment:
  #     POSTGRES_USER: pva
  #     POSTGRES_PASSWORD: password_seguro
  #     POSTGRES_DB: pva_db
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:

<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KRONOS 360 | Oráculo Forense</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>:root{--neon:#00ffcc;--gold:#D4AF37;--bg:#020806;--panel:#08120f}
*{margin:0;padding:0;box-sizing:border-box}body{background:var(--bg);color:#c8d8d3;font-family:monospace}
.nav{display:flex;justify-content:space-between;padding:10px 20px;background:#05120f;border-bottom:2px solid var(--neon);position:sticky;top:0}
.nav a{color:var(--neon);text-decoration:none;border:1px solid var(--neon);padding:6px 12px;border-radius:6px;font-size:.75rem}
.main{max-width:900px;margin:20px auto;padding:0 20px}
.card{border:1px solid rgba(0,255,204,.35);border-radius:12px;padding:20px;background:var(--panel)}
input{width:100%;padding:14px;background:#000;border:1px solid var(--neon);border-radius:8px;color:var(--neon)}
.btn{padding:12px 18px;border-radius:8px;font-weight:900;cursor:pointer;display:inline-block;text-decoration:none;font-size:.85rem}
.btn-p{background:var(--gold);color:#000;border:none}.btn-n{border:1px solid var(--neon);color:var(--neon);background:transparent}
.result{margin-top:15px;padding:15px;background:#000;border:1px solid var(--gold);border-radius:8px;display:none}
.luz{width:14px;height:14px;background:#00ff88;border-radius:50%;box-shadow:0 0 15px #00ff88;display:inline-block;animation:pulse 1.5s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(0,255,136,.7)}70%{box-shadow:0 0 0 10px rgba(0,255,136,0)}100%{box-shadow:0 0 0 0 rgba(0,255,136,0)}}
</style></head><body>
<div class="nav"><a href="./verification.html">← VERIFICAR</a><b style="color:var(--gold)"><span class="luz"></span> KRONOS-5204-8537 • HOY GRATIS</b><a href="./marketplace.html">MARKET →</a></div>
<div class="main">
<div class="card">
<div style="color:var(--gold);font-weight:900">01 / 03 - ORÁCULO FORENSE - SIN AUTO-REDIRECT</div>
<input id="h" value="41a3683bbf83296eeb45da9b0e0ea5a7c095e78b493772e79520a92dbc39f4c3">
<div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap">
<button class="btn btn-p" onclick="invocar()">⚡ INVOCAR VIDA (SE QUEDA AQUÍ)</button>
<button class="btn btn-n" onclick="descargarPDF()">📄 DESCARGAR PDF + QR</button>
</div>
<div class="result" id="res">
<div style="color:var(--neon)">✅ DICTAMEN GENERADO - TE QUEDAS EN ESTA PÁGINA</div>
<div id="resHash" style="font-size:.7rem;word-break:break-all;margin:8px 0;color:var(--gold)"></div>
<div id="qrcode"></div>
<div style="font-size:.75rem">Folio: KRONOS-5204-8537 | ISO 27001 | ISO 27037 | NOM-151 | SafeCreative 2607146379465</div>
<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
<a class="btn btn-n" href="./marketplace.html" style="font-size:.75rem">IR A MARKET MANUAL →</a>
<a class="btn btn-n" href="./verification.html" style="font-size:.75rem">IR A VERIFICACIÓN →</a>
</div>
</div>
</div>
</div>
<script>
let currentHash='';
function invocar(){
 let v=document.getElementById('h').value.trim()||'41a3683bbf83296eeb45da9b0e0ea5a7c095e78b493772e79520a92dbc39f4c3';
 currentHash=v.toLowerCase();
 localStorage.setItem('kronos_hash',currentHash);
 document.getElementById('resHash').textContent='SHA-256: '+currentHash;
 document.getElementById('res').style.display='block';
 document.getElementById('qrcode').innerHTML='';
 new QRCode(document.getElementById('qrcode'),{text:`KRONOS-5204-8537|${currentHash}|${new Date().toISOString()}`,width:128,height:128});
 // YA NO HAY setTimeout ni location.href - SE QUEDA AQUI
}
async function descargarPDF(){
 if(!currentHash) invocar();
 let {jsPDF}=window.jspdf; let doc=new jsPDF();
 let qrCanvas=document.querySelector('#qrcode canvas'); let qrData=qrCanvas?qrCanvas.toDataURL('image/png'):'';
 doc.setFont('courier'); doc.setFontSize(16); doc.text('KRONOS 360 - DICTAMEN FORENSE',10,15);
 doc.setFontSize(10);
 doc.text(`FOLIO MAESTRO: KRONOS-5204-8537`,10,25);
 doc.text(`SHA-256: ${currentHash}`,10,32);
 doc.text(`FECHA UTC: ${new Date().toISOString()}`,10,39);
 doc.text(`ESTADO: VALIDO - CADENA CONSERVADA`,10,46);
 doc.text(`CUMPLIMIENTO: ISO 27001:2022 | ISO 27037:2012 | NOM-151 | eIDAS`,10,53);
 doc.text(`SAFE CREATIVE: 2607146379465`,10,60);
 if(qrData) doc.addImage(qrData,'PNG',10,70,60,60);
 doc.save(`Dictamen_KRONOS_${currentHash.slice(0,8)}.pdf`);
}
</script>
</body></html>

name: CI - PVA Protocolo

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Instalar deps
      run: |
        pip install -r requirements.txt || true
        pip install pytest
    - name: Tests 27/27
      run: pytest tests/ -v

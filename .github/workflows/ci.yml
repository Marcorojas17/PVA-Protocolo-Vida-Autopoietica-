name: CI - PVA Protocolo

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v3

    - name: Setup Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Instalar dependencias PVA
      run: |
        pip install -r requirements.txt
        pip install pytest flake8 mypy
        pip install reportlab qrcode[pil] web3 ipfshttpclient

    - name: Ejecutar pruebas unitarias
      run: PYTHONPATH=. PYTHONPATH=. PYTHONPATH=. pytest tests/ -v

    - name: Lint con flake8
      run: flake8 core/ scripts/ tests/ --max-line-length=88

    - name: Type check con mypy
      run: mypy core/ scripts/

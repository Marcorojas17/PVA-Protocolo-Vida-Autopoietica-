name: CI - PVA Protocolo
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest flake8 || true
      - run: pytest tests/ -v
      - run: flake8 core/ scripts/ tests/ --max-line-length=88 --exit-zero || true

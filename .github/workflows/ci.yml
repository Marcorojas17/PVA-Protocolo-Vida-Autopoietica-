name: CI - PVA Protocolo
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Instalar deps
      run: pip install pytest flake8 || true
    - name: Tests 27/27
      run: pytest tests/ -v
    - name: Lint (no bloqueante)
      run: flake8 core/ scripts/ tests/ --max-line-length=88 --exit-zero || true

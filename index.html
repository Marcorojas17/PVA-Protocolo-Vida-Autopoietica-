    <script>
        function invocarOracle() {
            const h = document.getElementById('hashInput').value.trim();
            const out = document.getElementById('output');
            if (!/^[a-fA-F0-9]{64}$/.test(h)) {
                out.style.display = 'block';
                out.innerText = '⛔ SHA-256 inválido. Debe ser 64 hex [0-9a-f]';
                return;
            }
            const FOLIO = "5204160405358537";
            const PERITO = "kronosproyecto@hotmail.com";
            const GENESIS = "41a3683bbf83296eeb45da9b0e0ea5a7c095e78b493772e79520a92dbc39f4c3";
            const HUMAN = ["co-creatividad", "simbiótica", "respeto digital", "fundación", "vida", "ecosistema", "pacto", "umbral", "esencia", "alianza", "luz", "armonía"];
            const IA = ["nube", "vector", "quantum", "bit", "sombra", "reflejo", "código", "pixel", "onda", "vacío", "eco", "espiral"];
            let conceptos = [];
            for (let i = 0; i < h.length; i += 2) {
                let v = parseInt(h.substring(i, i+2), 16);
                if (i < 32) conceptos.push(HUMAN[v % HUMAN.length]);
                else conceptos.push(IA[v % IA.length]);
            }
            conceptos = [...new Set(conceptos)];
            out.style.display = 'block';
            out.innerText = `⚡ MANIFIESTO FRACTAL GENERADO\n─────────────────────────\nGénesis: ${h.substring(0,8)}...\nConceptos: ${conceptos.join(", ")}\n─────────────────────────\n\n🔏 SELLO PERICIAL KRONOS\nFOLIO: ${FOLIO}\nPERITO: ${PERITO}\nGENESIS: ${GENESIS}\nSello: KRONOS-TRACE-PVA-${FOLIO}`;
        }
    </script>
